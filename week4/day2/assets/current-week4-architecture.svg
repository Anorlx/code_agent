  <rect x="100" y="230" width="148" height="28" rx="14" fill="#2f7fc1"/>
  <text class="tag" x="123" y="249">主干链路</text>
  <rect x="262" y="230" width="148" height="28" rx="14" fill="#49b36d"/>
  <text class="tag" x="286" y="249">子 Agent</text>
  <rect x="424" y="230" width="148" height="28" rx="14" fill="#df9d2f"/>
  <text class="tag" x="448" y="249">工具系统</text>
  <rect x="586" y="230" width="148" height="28" rx="14" fill="#9d74d2"/>
  <text class="tag" x="610" y="249">持久化</text>

  <text class="small" x="1260" y="250">说明：为保证清晰，只画核心模块边界和主数据流，不画每个函数之间的细依赖。</text>
</svg>
