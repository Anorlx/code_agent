  <path class="arrow-light" d="M 417 534 C 417 585 291 601 291 666"/>
  <path class="arrow-light" d="M 1472 534 C 1472 585 1411 601 1411 666"/>
  <path class="arrow-light" d="M 851 748 C 851 820 603 820 603 892"/>
  <path class="arrow-light" d="M 851 748 C 851 820 909 820 909 892"/>
