[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent"
version = "0.1.0"
description = "A local terminal code agent."
requires-python = ">=3.10"
dependencies = ["langgraph>=1.0,<2.0", "openai>=1.68"]

[project.scripts]
code-agent = "agent.main_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.setuptools.package-data]
"agent.tools.mcp" = ["settings.json"]
