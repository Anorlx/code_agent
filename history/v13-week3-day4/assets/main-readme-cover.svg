    <text x="24" y="31" class="label">StateGraph</text>
    <text x="24" y="55" class="muted">preprocess → API → tools</text>
    <rect x="244" y="0" width="190" height="74" rx="14" fill="#16251B" stroke="#22C55E" stroke-width="2"/>
    <text x="268" y="31" class="label">Tool Registry</text>
    <text x="268" y="55" class="muted">built-in · MCP · skills</text>
    <rect x="488" y="0" width="190" height="74" rx="14" fill="#2A1722" stroke="#EC4899" stroke-width="2"/>
    <text x="512" y="31" class="label">Memory</text>
    <text x="512" y="55" class="muted">TTL · score · observer</text>
    <path class="flow" d="M190 37H244"/>
    <path class="flow" d="M434 37H488"/>
