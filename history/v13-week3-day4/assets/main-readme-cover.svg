<svg width="1440" height="520" viewBox="0 0 1440 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">code_agent visual cover</title>
  <desc id="desc">A polished terminal agent interface with graph loop, permission gate, memory, MCP tools, fork workers and coordinator planning blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.48" stop-color="#102033"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="90" y1="72" x2="1350" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#182337"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86EFAC"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDA4AF"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <style>
      .title{font:800 58px Inter,Segoe UI,Arial,sans-serif;fill:#F8FAFC}
      .subtitle{font:500 22px Inter,Segoe UI,Arial,sans-serif;fill:#CBD5E1}
      .mono{font:600 18px SFMono-Regular,Consolas,monospace;fill:#D7E3F4}
      .small{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#94A3B8}
      .label{font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#F8FAFC}
      .tag{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#DCEBFF}
      .muted{font:600 13px Inter,Segoe UI,Arial,sans-serif;fill:#8392A8}
      .line{stroke:#334155;stroke-width:2}
      .flow{stroke:#60A5FA;stroke-width:3;stroke-linecap:round;stroke-dasharray:8 10}
    </style>
  </defs>
  <rect width="1440" height="520" rx="0" fill="url(#bg)"/>
  <path d="M0 431C171 384 301 421 459 376C622 329 704 256 873 279C1072 306 1179 414 1440 356V520H0V431Z" fill="#0B1220" opacity="0.78"/>
  <path d="M178 91H1262C1310.6 91 1350 130.4 1350 179V396C1350 431.3 1321.3 460 1286 460H154C118.7 460 90 431.3 90 396V179C90 130.4 129.4 91 178 91Z" fill="url(#panel)" stroke="#263449" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="130" cy="126" r="8" fill="#F87171"/>
  <circle cx="158" cy="126" r="8" fill="#FBBF24"/>
  <circle cx="186" cy="126" r="8" fill="#34D399"/>
  <text x="128" y="194" class="title">code_agent</text>
  <text x="132" y="235" class="subtitle">Local-first coding runtime for graph execution, safe tools, memory and MCP.</text>
  <rect x="130" y="279" width="440" height="58" rx="12" fill="#08111F" stroke="#243348"/>
  <text x="154" y="315" class="mono">code_agent&gt; inspect repo safety</text>
  <text x="132" y="383" class="small">Observable terminal runtime</text>
  <text x="132" y="413" class="small">Schema gate · Context manager · Tool router · User approval</text>
  <g transform="translate(665 142)">
