    <text x="146" y="163" class="label">Permission Gate</text>
    <text x="146" y="187" class="muted">validate · review · ask</text>
    <rect x="366" y="132" width="190" height="74" rx="14" fill="#111B2E" stroke="#38BDF8" stroke-width="2"/>
    <text x="390" y="163" class="label">Fork / Coordinator</text>
    <text x="390" y="187" class="muted">parallel research · specs</text>
    <path class="flow" d="M339 74V104C339 119 327 132 312 132"/>
    <path class="flow" d="M339 74V104C339 119 351 132 366 132"/>
  </g>
  <g transform="translate(902 384)">
    <rect x="0" y="0" width="86" height="30" rx="15" fill="url(#blue)"/>
    <text x="20" y="20" class="tag">graph</text>
    <rect x="98" y="0" width="102" height="30" rx="15" fill="url(#green)"/>
    <text x="119" y="20" class="tag">local</text>
    <rect x="212" y="0" width="118" height="30" rx="15" fill="url(#pink)"/>
    <text x="234" y="20" class="tag">review</text>
    <rect x="342" y="0" width="92" height="30" rx="15" fill="url(#amber)"/>
    <text x="366" y="20" class="tag">MCP</text>
