<svg width="1800" height="2420" viewBox="0 0 1800 2420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #fbfbfc; }
      .title { font: 800 34px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill: #222; }
      .subtitle { font: 500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill: #666; }
      .stage { font: 800 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill: #888; letter-spacing: .5px; }
      .box { fill: #fff; stroke: #dedede; stroke-width: 1.4; rx: 4; }
      .box-main { fill: #fff; stroke: #cfcfcf; stroke-width: 1.8; rx: 4; }
      .box-soft { fill: #fff; stroke: #e7e7e7; stroke-width: 1.3; rx: 4; }
      .box-store { fill: #fff; stroke: #d8d8e8; stroke-width: 1.6; rx: 4; }
      .box-tool { fill: #fff; stroke: #e4d8bf; stroke-width: 1.6; rx: 4; }
      .box-sub { fill: #fff; stroke: #cfe4d2; stroke-width: 1.6; rx: 4; }
      .diamond { fill: #fff; stroke: #dedede; stroke-width: 1.5; }
      .text { font: 500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill: #333; }
      .text-small { font: 500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill: #555; }
      .text-mini { font: 500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill: #777; }
      .label { font: 600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill: #555; }
      .line { fill: none; stroke: #777; stroke-width: 1.7; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #999; stroke-width: 1.3; stroke-dasharray: 5 5; marker-end: url(#arrowSoft); }
      .line-loop { fill: none; stroke: #777; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .line-store { fill: none; stroke: #8c7ab8; stroke-width: 1.4; stroke-dasharray: 5 5; marker-end: url(#arrowStore); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#777"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#999"/>
    </marker>
    <marker id="arrowStore" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8c7ab8"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="2420"/>
  <text class="title" x="88" y="72">Code Agent 完整关系图</text>
  <text class="subtitle" x="88" y="104">从 python main.py 启动，到用户输入、记忆召回、LangGraph 主循环、工具调用、Fork/Coordinator、状态落盘与后台记忆</text>

  <text class="stage" x="94" y="172">STARTUP</text>
  <rect class="box-main" x="730" y="140" width="300" height="72"/>
  <text class="text" x="808" y="170">python main.py</text>
  <text class="text-small" x="795" y="195">进入 agent.main_agent.cli.main</text>

  <rect class="box-main" x="700" y="260" width="360" height="78"/>
  <text class="text" x="802" y="292">CLI chat_loop</text>
  <text class="text-small" x="765" y="318">外层 while 会话循环 / TerminalUI</text>

  <path class="line" d="M880 212 L880 260"/>

  <rect class="box-store" x="220" y="395" width="290" height="108"/>
  <text class="text" x="296" y="426">SessionStore</text>
  <text class="text-small" x="254" y="454">setup / choose_session</text>
  <text class="text-small" x="254" y="480">sessions + session_messages</text>

  <rect class="box-store" x="565" y="395" width="290" height="108"/>
  <text class="text" x="635" y="426">CheckpointStore</text>
  <text class="text-small" x="594" y="454">setup / cleanup_old</text>
  <text class="text-small" x="594" y="480">unfinished checkpoint 恢复</text>

  <rect class="box-tool" x="910" y="385" width="330" height="128"/>
  <text class="text" x="1000" y="416">_load_tools</text>
  <text class="text-small" x="946" y="444">get_tool_registry()</text>
  <text class="text-small" x="946" y="470">MCP cache / discovery / refresh</text>
  <text class="text-small" x="946" y="496">Skills registry 加入统一工具池</text>

  <rect class="box-store" x="1295" y="395" width="285" height="108"/>
  <text class="text" x="1380" y="426">日志与指标</text>
  <text class="text-small" x="1328" y="454">startup_total_ms</text>
  <text class="text-small" x="1328" y="480">logs/agent.log</text>

  <path class="line" d="M790 338 C790 372 365 360 365 395"/>
  <path class="line" d="M842 338 C842 372 710 360 710 395"/>
  <path class="line" d="M918 338 C918 367 1075 360 1075 385"/>
  <path class="line" d="M972 338 C972 372 1437 360 1437 395"/>

  <rect class="box-tool" x="1080" y="555" width="470" height="132"/>
  <text class="text" x="1245" y="588">统一 Tools Registry</text>
  <text class="text-small" x="1117" y="617">本地工具: read/write/grep/glob/edit/run/calc/time/todo/memory</text>
  <text class="text-small" x="1117" y="645">MCP 工具: mcp__server__tool，映射成内部 Tool dict</text>
  <text class="text-small" x="1117" y="673">Skill 工具: /skill slash + skill_tool_spec + make_skill_runner</text>
  <path class="line" d="M1075 513 L1232 555"/>

  <text class="stage" x="94" y="620">USER TURN</text>
  <rect class="box-main" x="730" y="585" width="300" height="72"/>
  <text class="text" x="815" y="616">用户输入</text>
  <text class="text-small" x="775" y="642">code_agent&gt; 读取一轮问题</text>

  <path class="line" d="M880 338 C880 430 880 510 880 585"/>

  <rect class="diamond" x="785" y="718" width="190" height="190" transform="rotate(45 880 813)"/>
  <text class="text" x="812" y="810">命令类型?</text>
  <text class="text-small" x="798" y="835">exit / help / @ / skill</text>

  <path class="line" d="M880 657 L880 718"/>

  <rect class="box-soft" x="245" y="772" width="260" height="84"/>
  <text class="text" x="315" y="804">内置命令</text>
  <text class="text-small" x="285" y="830">/help / /skills / /session</text>

  <rect class="box-soft" x="1235" y="760" width="285" height="108"/>
  <text class="text" x="1300" y="792">强制路由输入</text>
  <text class="text-small" x="1270" y="820">/@server 强制 MCP</text>
  <text class="text-small" x="1270" y="846">/skill 强制内置技能</text>

  <path class="line-soft" d="M785 813 C680 813 610 813 505 813"/>
  <path class="line-soft" d="M975 813 C1070 813 1140 813 1235 813"/>

  <rect class="box-sub" x="700" y="965" width="360" height="94"/>
  <text class="text" x="790" y="998">memory_retrieval</text>
  <text class="text-small" x="735" y="1024">前置召回长期记忆，format_memory_context</text>
  <text class="text-mini" x="735" y="1046">读取 MEMORY.md，相关时再读取 memory/*.md</text>

  <path class="line" d="M880 908 L880 965"/>

  <rect class="box-store" x="1210" y="970" width="310" height="86"/>
  <text class="text" x="1285" y="1003">Memory Store</text>
  <text class="text-small" x="1248" y="1029">MEMORY.md + memory/**/*.md</text>
  <path class="line-store" d="M1210 1013 L1060 1013"/>

  <rect class="box-main" x="700" y="1115" width="360" height="80"/>
  <text class="text" x="800" y="1147">QueryEngine</text>
  <text class="text-small" x="764" y="1173">submitMessage → run_agent</text>

  <path class="line" d="M880 1059 L880 1115"/>

  <rect class="box-main" x="670" y="1250" width="420" height="88"/>
  <text class="text" x="765" y="1284">LangGraph Main Agent</text>
  <text class="text-small" x="722" y="1310">StateGraph: messages / tools / memory / run_id / checkpoint</text>

  <path class="line" d="M880 1195 L880 1250"/>

  <text class="stage" x="94" y="1420">LANGGRAPH LOOP</text>
  <rect class="box-main" x="210" y="1415" width="265" height="84"/>
  <text class="text" x="284" y="1448">preprocess</text>
  <text class="text-small" x="244" y="1474">turn+1 / checkpoint / token check</text>

  <rect class="box-sub" x="555" y="1415" width="260" height="84"/>
  <text class="text" x="608" y="1448">mode_router</text>
  <text class="text-small" x="590" y="1474">chat / tools / fork / coordinator</text>

  <rect class="box-sub" x="895" y="1415" width="260" height="84"/>
  <text class="text" x="958" y="1448">tool_search</text>
  <text class="text-small" x="930" y="1474">选择本轮开放工具</text>

  <rect class="box-main" x="1240" y="1415" width="285" height="84"/>
  <text class="text" x="1315" y="1448">api_call</text>
  <text class="text-small" x="1275" y="1474">DashScope 流式主模型</text>

  <path class="line" d="M880 1338 C880 1384 342 1370 342 1415"/>
  <path class="line" d="M475 1457 L555 1457"/>
  <path class="line" d="M815 1457 L895 1457"/>
  <path class="line" d="M1155 1457 L1240 1457"/>

  <rect class="box-sub" x="180" y="1555" width="300" height="98"/>
  <text class="text" x="260" y="1588">context_manager</text>
  <text class="text-small" x="214" y="1616">micro_compact / collapse / auto_compact</text>
  <text class="text-mini" x="214" y="1638">超过预算时压缩上下文</text>
  <path class="line-soft" d="M342 1499 L330 1555"/>

  <rect class="box-soft" x="560" y="1555" width="280" height="98"/>
  <text class="text" x="650" y="1588">selected_tools</text>
  <text class="text-small" x="596" y="1616">always tools + lazy tools</text>
  <text class="text-mini" x="596" y="1638">仅选中的 schema 交给主模型</text>
  <path class="line-soft" d="M1025 1499 C1025 1548 700 1518 700 1555"/>

  <rect class="box-sub" x="920" y="1555" width="310" height="98"/>
  <text class="text" x="985" y="1588">Fork / Coordinator 计划</text>
  <text class="text-small" x="955" y="1616">fork_tasks planned_tool_call</text>
  <text class="text-small" x="955" y="1638">coordinator_plan planned_tool_call</text>
  <path class="line-soft" d="M685 1499 C685 1548 1075 1518 1075 1555"/>

  <rect class="box-main" x="1240" y="1565" width="285" height="88"/>
  <text class="text" x="1310" y="1598">stream events</text>
  <text class="text-small" x="1275" y="1624">assistant_delta → TerminalUI</text>
  <text class="text-small" x="1275" y="1646">token_usage / checkpoint</text>
  <path class="line" d="M1382 1499 L1382 1565"/>

  <rect class="diamond" x="1292" y="1712" width="180" height="180" transform="rotate(45 1382 1802)"/>
  <text class="text" x="1325" y="1798">有 tool_calls?</text>
  <text class="text-small" x="1362" y="1824">是 / 否</text>

  <path class="line" d="M1382 1653 L1382 1712"/>

  <rect class="box-main" x="1252" y="1960" width="260" height="78"/>
  <text class="text" x="1295" y="1992">termination_check</text>
  <text class="text-small" x="1300" y="2018">completed / stop_hook</text>
  <path class="line" d="M1382 1892 L1382 1960"/>
  <text class="label" x="1400" y="1930">否</text>

  <text class="stage" x="94" y="1775">TOOL PATH</text>
  <rect class="box-tool" x="760" y="1745" width="310" height="88"/>
  <text class="text" x="825" y="1778">StreamingToolExecutor</text>
  <text class="text-small" x="795" y="1804">tool_call 出现后立即 submit</text>
  <text class="text-small" x="795" y="1826">只读可并发，结果按顺序 yield</text>

  <path class="line" d="M1292 1802 C1215 1802 1150 1789 1070 1789"/>
  <text class="label" x="1185" y="1780">是</text>

  <rect class="box-tool" x="400" y="1745" width="280" height="88"/>
  <text class="text" x="490" y="1778">tool_runner</text>
  <text class="text-small" x="435" y="1804">validateInput / batch</text>
  <text class="text-small" x="435" y="1826">run tools[name]["run"]</text>
  <path class="line" d="M760 1789 L680 1789"/>

  <rect class="box-sub" x="400" y="1885" width="280" height="86"/>
  <text class="text" x="455" y="1918">permission_review</text>
  <text class="text-small" x="435" y="1944">规则 + 上下文审查 + 交互确认</text>
  <path class="line" d="M540 1833 L540 1885"/>

  <rect class="box-tool" x="120" y="1885" width="220" height="86"/>
  <text class="text" x="182" y="1918">工具池</text>
  <text class="text-small" x="150" y="1944">local / MCP / skill</text>
  <path class="line" d="M400 1928 L340 1928"/>

  <rect class="box-sub" x="120" y="2040" width="270" height="122"/>
  <text class="text" x="170" y="2073">特殊编排工具</text>
  <text class="text-small" x="150" y="2101">fork_tasks → run_fork_tasks</text>
  <text class="text-small" x="150" y="2125">coordinator_plan → research+synthesis</text>
  <text class="text-mini" x="150" y="2148">worker 继承裁剪后的 parent messages</text>
  <path class="line-soft" d="M230 1971 L230 2040"/>

  <rect class="box-main" x="760" y="1960" width="310" height="88"/>
  <text class="text" x="842" y="1993">result_backfill</text>
  <text class="text-small" x="795" y="2019">assistant message + tool results</text>
  <text class="text-small" x="795" y="2041">snip_context 清理旧工具结果</text>
  <path class="line" d="M540 1971 C540 2020 690 2004 760 2004"/>

  <rect class="box-main" x="760" y="2110" width="310" height="88"/>
  <text class="text" x="870" y="2143">verify</text>
  <text class="text-small" x="795" y="2169">run_verifier / verifier_review</text>
  <text class="text-small" x="795" y="2191">有副作用时追加验证信息</text>
  <path class="line" d="M915 2048 L915 2110"/>

  <path class="line-loop" d="M915 2198 C915 2260 1640 2260 1640 1294 C1640 1240 1090 1260 1090 1294"/>
  <text class="label" x="1500" y="2250">工具结果进入下一轮 preprocess</text>

  <text class="stage" x="94" y="2240">PERSISTENCE</text>
  <rect class="box-store" x="1220" y="2110" width="300" height="88"/>
  <text class="text" x="1300" y="2143">Checkpoint</text>
  <text class="text-small" x="1255" y="2169">各阶段 save_checkpoint</text>
  <text class="text-small" x="1255" y="2191">stream 中按时间/字符数落盘</text>
  <path class="line-store" d="M1252 2000 C1170 2000 1110 2040 1070 2148"/>
  <path class="line-store" d="M1220 2154 L1070 2154"/>

  <rect class="box-store" x="675" y="2265" width="280" height="82"/>
  <text class="text" x="755" y="2298">保存 session</text>
  <text class="text-small" x="710" y="2324">SessionStore.save_messages</text>
  <path class="line" d="M1382 2038 C1382 2240 815 2208 815 2265"/>

  <rect class="box-sub" x="285" y="2265" width="270" height="82"/>
  <text class="text" x="350" y="2298">MemoryObserver</text>
  <text class="text-small" x="320" y="2324">后台 memory_writer 抽取长期记忆</text>
  <path class="line-soft" d="M675 2306 L555 2306"/>

  <rect class="box-sub" x="1030" y="2265" width="285" height="82"/>
  <text class="text" x="1090" y="2298">session_summarizer</text>
  <text class="text-small" x="1065" y="2324">后台更新 title / summary</text>
  <path class="line-soft" d="M955 2306 L1030 2306"/>

  <rect class="box-store" x="1380" y="2265" width="250" height="82"/>
  <text class="text" x="1435" y="2298">运行工件</text>
  <text class="text-small" x="1415" y="2324">logs / MCP cache / scratchpad</text>
  <path class="line-soft" d="M1315 2306 L1380 2306"/>

  <rect class="box-soft" x="88" y="2358" width="1540" height="34"/>
  <text class="text-mini" x="112" y="2380">说明：实线表示主数据流；虚线表示辅助上下文、存储或后台任务。当前代码已包含 Local Tools、MCP Tools、Skill Tools，并通过 tool_search / lazy exposure 控制每轮开放给主模型的 schema。</text>
</svg>
